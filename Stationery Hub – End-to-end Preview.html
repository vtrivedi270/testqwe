function hrEditSave(){var r=cur(),why=($('#er2').value||'').trim(),post=r.status==='Ordered'||r.status==='Delivered';if(!why){toast('Reason is required');return}
if(!S.el.length){toast('A request needs at least one item');return}

var old=r.items;r.items=S.el.map(function(l){var o=old.filter(function(i){return i.n===l.n})[0];if(o){if(o.q!==l.q){o.q=l.q;if(post){o.ap=l.q;o.ord=Math.max(0,l.q-o.st)}else{o.ap=undefined;o.ord=0}}return o}var it=item(l.n);return I(it.name,it.unit,it.rate,l.q,post?l.q:undefined,0)});
hist(r,'HR edit','HRAD',why);mo();toast(post?'Items updated - please resend the PO':'Line items updated');render()}
function po(){var r=cur();mo('<h2>Purchase order preview</h2><div class="card" style="background:#fff;color:#111"><b>PURCHASE ORDER · '+esc(r.po||'PO-'+no(r))+'</b><div style="font-size:12px;margin:6px 0">Vendor: '+esc(r.vendor||'(select vendor)')+'</div><table style="color:#111"><tbody>'+r.items.map(function(i){var q=r.status==='HRApproval'||r.status==='InReview'?i.q:i.ord;return '<tr><td>'+esc(i.n)+'</td><td>'+q+' '+i.u+'</td><td>'+fm(i.r*q)+'</td></tr>'}).join('')+'</tbody></table></div><button class="btn" style="margin-top:12px" onclick="mo()">Close</button>')}

function stock(){var rows=M.items.filter(function(i){return(!S.low||i.stock<=i.reorder)&&(!S.sc||i.cat===S.sc)&&(!S.sq||(i.name+i.code).toLowerCase().indexOf(S.sq.toLowerCase())>-1)});var pg=pager('stock',rows.length),vis=sl('stock',rows);
return '<div class="row" style="justify-content:space-between"><h1>Store stock</h1><div class="row"><input id="sqi" placeholder="Search item" value="'+esc(S.sq)+'" oninput="S.sq=this.value;rp(\'stock\');clearTimeout(window.T);window.T=setTimeout(function(){render();var e=$(\'#sqi\');e.focus();e.setSelectionRange(S.sq.length,S.sq.length)},250)"><select aria-label="Category" onchange="S.sc=this.value;rp(\'stock\');render()"><option value="">All categories</option>'+M.categories.map(function(c){return '<option'+(S.sc===c.name?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select><button class="btn g" onclick="S.low=!S.low;rp(\'stock\');render()">'+(S.low?'Showing low stock':'Low stock only')+'</button></div></div><div class="card"><div class="tw"><table><thead><tr><th>Code</th><th>Item</th><th>Category</th><th>In stock</th><th>Reorder</th><th>Status</th><th></th></tr></thead><tbody>'+(vis.length?vis.map(function(i){var l=i.stock<=i.reorder;return '<tr><td>'+i.code+'</td><td><b>'+esc(i.name)+'</b></td><td>'+esc(i.cat)+'</td><td>'+i.stock+' '+i.unit+'</td><td>'+i.reorder+'</td><td><span class="chip" style="background:'+(l?'#dc2626':'#15803d')+'">'+(l?'Low':'OK')+'</span></td><td><div class="row" style="gap:6px"><button class="btn s" onclick="stkForm('+i.id+',\'r\')">Add stock</button><button class="btn g s" onclick="stkForm('+i.id+',\'a\')">Adjust</button><button class="btn g s" onclick="stkHist('+i.id+')">History</button></div></td></tr>'}).join(''):'<tr><td colspan="7" class="mut">No items.</td></tr>')+'</tbody></table></div>'+pg+'</div>'}
function it_(id){return M.items.filter(function(i){return i.id===id})[0]}
function stkForm(id,m){var i=it_(id);mo('<h2>'+esc(i.name)+'</h2><div class="mut">Current stock: <b>'+i.stock+' '+i.unit+'</b></div><div class="fld" style="margin-top:10px"><span class="lab">'+(m==='r'?'Quantity received':'New stock quantity')+'</span><input id="sq" type="number" min="0" '+(m==='a'?'value="'+i.stock+'"':'')+'></div><div class="fld" style="margin-top:10px"><span class="lab">'+(m==='r'?'Note (supplier / bill no)':'Reason (required)')+'</span><input id="sn"></div><div class="row" style="margin-top:12px"><button class="btn" onclick="stkSave('+id+',\''+m+'\')">Save</button><button class="btn g" onclick="mo()">Cancel</button></div>')}
function stkSave(id,m){var i=it_(id),q=+$('#sq').value,n=($('#sn').value||'').trim();if(m==='r'){if(!(q>0)){toast('Quantity must be above zero');return}i.stock+=q;T.unshift({item:id,type:'Receipt',q:q,note:n,d:'25 Oct'})}else{if(!n){toast('Reason is required');return}if(q<0){toast('Stock cannot be negative');return}T.unshift({item:id,type:'Adjustment',q:q-i.stock,note:n,d:'25 Oct'});i.stock=q}mo();toast('Stock updated');render()}
function stkHist(id){var i=it_(id),t=T.filter(function(x){return x.item===id});mo('<h2>'+esc(i.name)+' · movements</h2><table><thead><tr><th>Date</th><th>Type</th><th>Qty</th><th>Note</th></tr></thead><tbody>'+(t.length?t.map(function(x){return '<tr><td>'+x.d+'</td><td>'+x.type+'</td><td style="color:'+(x.type==='Issue'||x.q<0?'#dc2626':'#15803d')+'">'+(x.type==='Issue'?'-':x.q>0?'+':'')+x.q+'</td><td>'+esc(x.note)+'</td></tr>'}).join(''):'<tr><td colspan="4" class="mut">No movements yet.</td></tr>')+'</tbody></table><button class="btn" style="margin-top:12px" onclick="mo()">Close</button>')}
/* ---------- delegation ---------- */
function deleg(){var x=S.role,me=PERSON[x],own=CH.indexOf(x)>-1,froms=own?[me]:['A. Mehta','R. Shah','F. Desai'],emps=M.emps.filter(function(e){return e.active}).map(function(e){return e.name}),rows=x==='Admin'?D:D.filter(function(d){return d.from===me||d.to===me});
return '<h1>Delegation</h1><div class="card"><h2>Delegate approvals</h2><div class="mut">While active, the delegate sees the approver’s pending requests and can approve, amend or reject. Their decision is recorded as “on behalf of”. Try it: as Reporting Manager (A. Mehta) delegate to Vishal, then switch “View as” to Requestor and open Pending for me.</div><div class="row" style="margin-top:12px;align-items:flex-end"><div class="fld"><span class="lab">Approver</span><select id="df">'+froms.map(opt).join('')+'</select></div><div class="fld"><span class="lab">Delegate to</span><select id="dt">'+emps.map(opt).join('')+'</select></div><div class="fld"><span class="lab">From</span><input id="ds" type="date" value="2026-10-25"></div><div class="fld"><span class="lab">To</span><input id="de" type="date" value="2026-10-31"></div><div class="fld"><span class="lab">Reason</span><input id="dr"></div><button class="btn" onclick="dAdd()">Create delegation</button></div></div>'+
'<div class="card"><h2>'+(x==='Admin'?'All delegations':'My delegations')+'</h2><div class="tw"><table><thead><tr><th>Approver</th><th>Delegate</th><th>From</th><th>To</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>'+(rows.length?rows.map(function(d){var s=!d.active?['Revoked','#6b7280']:d.start>TODAY?['Scheduled','#2563eb']:d.end<TODAY?['Expired','#b45309']:['Active now','#15803d'];return '<tr><td>'+esc(d.from)+(d.from===me?' (you)':'')+'</td><td>'+esc(d.to)+(d.to===me?' (you)':'')+'</td><td>'+d.start+'</td><td>'+d.end+'</td><td>'+esc(d.reason||'–')+'</td><td><span class="chip" style="background:'+s[1]+'">'+s[0]+'</span></td><td>'+(d.active&&(d.from===me||x==='Admin')?'<button class="btn g s" onclick="dRev('+d.id+')">Revoke</button>':'')+'</td></tr>'}).join(''):'<tr><td colspan="7" class="mut">No delegations.</td></tr>')+'</tbody></table></div></div>'}
function dAdd(){var f=$('#df').value,t=$('#dt').value,s=$('#ds').value,e=$('#de').value;if(f===t){toast('Choose a different delegate');return}if(e<s){toast('End date cannot be before start date');return}if(e<TODAY){toast('End date is in the past');return}if(D.some(function(d){return d.active&&d.from===f&&d.start<=e&&d.end>=s})){toast('An active delegation already exists for these dates');return}
D.push({id:D.length+2,from:f,to:t,start:s,end:e,reason:$('#dr').value,active:true});mail(t,'You are a delegate approver');toast('Delegation created, '+t+' notified');render()}
function dRev(id){D.filter(function(d){return d.id===id})[0].active=false;toast('Delegation revoked');render()}

function emails(){var rows=E.filter(function(m){return !S.es||m.st===S.es}),pg=pager('emails',rows.length),vis=sl('emails',rows);
return '<div class="row" style="justify-content:space-between"><h1>E-mail log</h1><select aria-label="Status" onchange="S.es=this.value;rp(\'emails\');render()"><option value="">All statuses</option>'+['Pending','Failed','Sent'].map(function(v){return '<option'+(S.es===v?' selected':'')+'>'+v+'</option>'}).join('')+'</select></div><div class="note">Failed and pending mails are retried automatically every 2 minutes. You can also retry one manually.</div><div class="card"><div class="tw"><table><thead><tr><th>Created</th><th>To</th><th>Subject</th><th>Status</th><th>Tries</th><th>Error</th><th></th></tr></thead><tbody>'+(vis.length?vis.map(function(m){var c={Sent:'#15803d',Pending:'#b45309',Failed:'#dc2626'}[m.st];return '<tr><td>'+m.d+'</td><td>'+esc(m.to)+'</td><td>'+esc(m.sub)+'</td><td><span class="chip" style="background:'+c+'">'+m.st+'</span></td><td>'+m.tr+'</td><td>'+esc(m.err||'–')+'</td><td>'+(m.st!=='Sent'?'<button class="btn g s" onclick="mRetry('+m.id+')">Retry</button>':'')+'</td></tr>'}).join(''):'<tr><td colspan="7" class="mut">No mails.</td></tr>')+'</tbody></table></div>'+pg+'</div>'}

function adm(){var k=S.adm,c=CFG[k],all=M[k].filter(function(r){return(S.inact||r.active)&&(!S.aq||c[2].some(function(f){return String(r[f[0]]).toLowerCase().indexOf(S.aq.toLowerCase())>-1}))}),pg=pager('admin',all.length),rows=sl('admin',all);
return '<div class="row" style="justify-content:space-between"><h1>Master data</h1><button class="btn" onclick="aForm()">+ Add '+c[1]+'</button></div><div class="card"><div class="tabs">'+Object.keys(CFG).map(function(t){return '<button class="tab'+(k===t?' on':'')+'" onclick="S.adm=\''+t+'\';S.aq=\'\';rp(\'admin\');render()">'+CFG[t][0]+'</button>'}).join('')+'</div><div class="row" style="margin:12px 0"><input id="aqi" placeholder="Search '+c[0].toLowerCase()+'" value="'+esc(S.aq)+'" oninput="S.aq=this.value;rp(\'admin\');clearTimeout(window.T);window.T=setTimeout(function(){render();var e=$(\'#aqi\');e.focus();e.setSelectionRange(S.aq.length,S.aq.length)},250)"><label class="mut"><input type="checkbox" '+(S.inact?'checked':'')+' onchange="S.inact=this.checked;rp(\'admin\');render()"> Show inactive</label><span class="mut">'+all.length+' of '+M[k].length+'</span></div><div class="tw"><table><thead><tr>'+c[2].map(function(f){return '<th>'+f[1]+'</th>'}).join('')+'<th>Active</th><th></th></tr></thead><tbody>'+(rows.length?rows.map(function(r){return '<tr style="opacity:'+(r.active?1:.5)+'">'+c[2].map(function(f){return '<td>'+esc(r[f[0]])+'</td>'}).join('')+'<td><input type="checkbox" aria-label="Active" '+(r.active?'checked':'')+' onchange="aTog('+r.id+')"></td><td><div class="row" style="gap:6px"><button class="btn g s" onclick="aForm('+r.id+')">Edit</button><button class="btn g s" style="color:var(--bad)" onclick="aDel('+r.id+')">Delete</button></div></td></tr>'}).join(''):'<tr><td colspan="'+(c[2].length+2)+'" class="mut">No records.</td></tr>')+'</tbody></table></div>'+pg+'</div>'}
function aForm(id){var k=S.adm,c=CFG[k],r=id?M[k].filter(function(z){return z.id===id})[0]:{};S.aid=id||0;
mo('<h2>'+(id?'Edit ':'Add ')+c[1]+'</h2>'+c[2].map(function(f){var v=r[f[0]]===undefined?'':r[f[0]],t=f[2],inp;if(t&&t.charAt(0)==='@')inp='<select id="f_'+f[0]+'">'+t.slice(1).split(',').map(function(o){return '<option'+(o===v?' selected':'')+'>'+o+'</option>'}).join('')+'</select>';else if(t&&t!=='#')inp='<select id="f_'+f[0]+'">'+M[t].filter(function(o){return o.active}).map(function(o){return '<option'+(o.name===v?' selected':'')+'>'+esc(o.name)+'</option>'}).join('')+'</select>';else inp='<input id="f_'+f[0]+'" '+(t==='#'?'type="number" ':'')+'value="'+esc(v)+'">';return '<div class="fld" style="margin-bottom:10px"><span class="lab">'+f[1]+'</span>'+inp+'</div>'}).join('')+'<div class="row"><button class="btn" onclick="aSave()">Save</button><button class="btn g" onclick="mo()">Cancel</button></div>')}
function aSave(){var k=S.adm,c=CFG[k],o={};for(var n=0;n<c[2].length;n++){var f=c[2][n],v=$('#f_'+f[0]).value.trim();if(!v){toast(f[1]+' is required');return}o[f[0]]=f[2]==='#'?+v:v}
